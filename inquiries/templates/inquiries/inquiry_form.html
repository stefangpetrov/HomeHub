{% extends "base.html" %}

{% block title %}
    Send Inquiry
{% endblock %}

{% block content %}

    <h1>Send Inquiry</h1>

    <p>
        About:
        <strong>{{ property.title }}</strong>
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary"
        >
            Send Inquiry
        </button>

        <a
            href="{% url 'property_detail' property.pk %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

{% endblock %}
